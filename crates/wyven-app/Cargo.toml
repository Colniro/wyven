[package]
name = "wyven-app"
description = "The Wyven code editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wyven"
path = "src/main.rs"

[dependencies]
wyven-render.workspace = true
wyven-buffer.workspace = true
wyven-syntax.workspace = true
arboard.workspace = true
rfd.workspace = true
nucleo-matcher.workspace = true
ignore.workspace = true
winit.workspace = true
pollster.workspace = true
memory-stats.workspace = true
log.workspace = true
env_logger.workspace = true
wyven-lsp.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
wyven-terminal.workspace = true
wyven-search.workspace = true
regex.workspace = true
wyven-git.workspace = true
wyven-dap.workspace = true
wyven-ai.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4"] }
