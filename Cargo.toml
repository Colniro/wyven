[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
wyven-render = { path = "crates/wyven-render" }
wyven-buffer = { path = "crates/wyven-buffer" }
wyven-syntax = { path = "crates/wyven-syntax" }
wyven-lsp = { path = "crates/wyven-lsp" }
wyven-dap = { path = "crates/wyven-dap" }
wyven-ai = { path = "crates/wyven-ai" }
wyven-terminal = { path = "crates/wyven-terminal" }
wyven-search = { path = "crates/wyven-search" }
wyven-git = { path = "crates/wyven-git" }
wyven-plugin = { path = "crates/wyven-plugin" }
similar = "3.2"
regex = "1.13"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
alacritty_terminal = "0.26"
url = "2.5"

ropey = "1.6"
unicode-width = "0.2"
arboard = "3.7"
rfd = "0.18"
nucleo-matcher = "0.3"
ignore = "0.4"
tree-sitter = "0.27"
tree-sitter-language = "0.1"
streaming-iterator = "0.1"
tree-sitter-c-sharp = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-rust = "0.24"

wgpu = "30"
glyphon = "0.12"
winit = "0.30.13"
pollster = "0.4"
memory-stats = "1.2"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Fast builds for trying things out: optimized, but without the slow final optimization step.
# cargo run --profile fast -- <Ordner>
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
# Line numbers in backtraces (crash.log), at little cost.
debug = "line-tables-only"

# Fast debug builds while keeping dependencies optimized (GPU and text code is slow unoptimized).
[profile.dev.package."*"]
opt-level = 2
