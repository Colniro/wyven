[package]
name = "text-tools"
description = "Example Wyven plugin: sort lines, change case, count words, trim on save"
version = "0.1.0"
edition = "2024"
publish = false

# Built on its own for WebAssembly, not part of Wyven's workspace:
#   cargo build --release --target wasm32-unknown-unknown
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wyven-plugin = { path = "../../crates/wyven-plugin" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
